policy:
  type: groot
  pretrained_path: nvidia/GR00T-N1.5-3B
  push_to_hub: false
dataset:
  repo_id: HomeRobotics/alotb_v0
rename_map:
  image: observation.images.image
  wrist_image: observation.images.wrist_image
  state: observation.state
  actions: action

# --- Memory Optimizations ---

# 1. Decrease batch size (default is 8, lower it to 2 or 1)
batch_size: 1

# 2. Enable LoRA (Parameter-Efficient Fine Tuning)
peft:
  method_type: LORA
  r: 1
  target_modules:
    # Diffusion Transformer (DiT) modules
    - "to_q"
    # - "to_k"
    # - "to_v"
    # - "to_out.0"
    # # Observation/Backbone Transformer modules (SigLip/T5/Observation Transformer)
    # - "q_proj"
    # - "v_proj"
    # - "k_proj"
    # - "o_proj"
wandb:
  enable: true
  project: "lerobot_groot_finetuning"
